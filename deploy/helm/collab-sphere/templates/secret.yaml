apiVersion: v1
kind: Secret
metadata:
  name: {{ include "collab-sphere.fullname" . }}-secrets
  labels:
    {{- include "collab-sphere.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_PUBLIC_KEY: {{ .Values.secrets.authPublicKey | quote }}
  SHARE_PRIVATE_KEY: {{ .Values.secrets.sharePrivateKey | quote }}
  INTERNAL_TOKEN: {{ .Values.secrets.internalToken | quote }}
  S3_ACCESS_KEY: {{ .Values.minio.rootUser | quote }}
  S3_SECRET_KEY: {{ .Values.minio.rootPassword | quote }}
  DATABASE_URL_DOCUMENT: {{ include "collab-sphere.databaseURL" (list . .Values.postgresql.databases.document) | quote }}
  DATABASE_URL_COMMENT: {{ include "collab-sphere.databaseURL" (list . .Values.postgresql.databases.comment) | quote }}
  DATABASE_URL_VERSION: {{ include "collab-sphere.databaseURL" (list . .Values.postgresql.databases.version) | quote }}
  DATABASE_URL_PERMISSION: {{ include "collab-sphere.databaseURL" (list . .Values.postgresql.databases.permission) | quote }}
  DATABASE_URL_EXPORT: {{ include "collab-sphere.databaseURL" (list . .Values.postgresql.databases.export) | quote }}
