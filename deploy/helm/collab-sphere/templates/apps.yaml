apiVersion: v1
kind: Service
metadata:
  name: {{ include "collab-sphere.fullname" . }}-document-service
  labels:
    {{- include "collab-sphere.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-service
spec:
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: metrics
      port: 9190
      targetPort: metrics
  selector:
    {{- include "collab-sphere.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: document-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "collab-sphere.fullname" . }}-document-service
  labels:
    {{- include "collab-sphere.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-service
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "collab-sphere.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: document-service
  template:
    metadata:
      labels:
        {{- include "collab-sphere.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: document-service
      annotations:
        {{- include "collab-sphere.metricsAnnotations" "9190" | nindent 8 }}
    spec:
      containers:
        - name: document-service
          image: "{{ .Values.images.document.repository }}:{{ .Values.images.document.tag }}"
          imagePullPolicy: {{ .Values.images.document.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9190
          env:
            {{- include "collab-sphere.secretEnv" (dict "root" . "name" "DATABASE_URL" "key" "DATABASE_URL_DOCUMENT") | nindent 12 }}
            - name: GRPC_ADDR
              value: ":9090"
            {{- include "collab-sphere.secretEnv" (dict "root" . "name" "AUTH_PUBLIC_KEY" "key" "AUTH_PUBLIC_KEY") | nindent 12 }}
            {{- include "collab-sphere.secretEnv" (dict "root" . "name" "INTERNAL_TOKEN" "key" "INTERNAL_TOKEN") | nindent 12 }}
            - name: PERMISSION_ADDR
              value: {{ include "collab-sphere.addr" (list . "permission-service" 9094) | quote }}
            - name: VERSION_ADDR
              value: {{ include "collab-sphere.addr" (list . "version-service" 9093) | quote }}
            - name: COMMENT_ADDR
              value: {{ include "collab-sphere.addr" (list . "comment-service" 9092) | quote }}
            {{- include "collab-sphere.extraEnv" (dict "root" . "metrics" ":9190") | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- include "collab-sphere.appResources" . | nindent 10 }}
---
