apiVersion: v1
kind: Service
metadata:
  name: {{ include "collab-sphere.fullname" . }}-collab-hub
  labels:
    {{- include "collab-sphere.labels" . | nindent 4 }}
    app.kubernetes.io/component: collab-hub
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9196
      targetPort: metrics
  selector:
    {{- include "collab-sphere.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collab-hub
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "collab-sphere.fullname" . }}-collab-hub
  labels:
    {{- include "collab-sphere.labels" . | nindent 4 }}
    app.kubernetes.io/component: collab-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "collab-sphere.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collab-hub
  template:
    metadata:
      labels:
        {{- include "collab-sphere.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collab-hub
      annotations:
        {{- include "collab-sphere.metricsAnnotations" "9196" | nindent 8 }}
    spec:
      containers:
        - name: collab-hub
          image: "{{ .Values.images.hub.repository }}:{{ .Values.images.hub.tag }}"
          imagePullPolicy: {{ .Values.images.hub.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9196
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: DOCUMENT_SERVICE_ADDR
              value: {{ include "collab-sphere.addr" (list . "document-service" 9090) | quote }}
            {{- include "collab-sphere.secretEnv" (dict "root" . "name" "AUTH_PUBLIC_KEY" "key" "AUTH_PUBLIC_KEY") | nindent 12 }}
            {{- include "collab-sphere.secretEnv" (dict "root" . "name" "INTERNAL_TOKEN" "key" "INTERNAL_TOKEN") | nindent 12 }}
            - name: PERMISSION_ADDR
              value: {{ include "collab-sphere.addr" (list . "permission-service" 9094) | quote }}
            - name: REDIS_URL
              value: {{ include "collab-sphere.redisURL" . | quote }}
            - name: PRESENCE_SERVICE_ADDR
              value: {{ include "collab-sphere.addr" (list . "presence-service" 9091) | quote }}
            - name: PRESENCE_HEARTBEAT
              value: "10s"
            - name: HUB_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- include "collab-sphere.extraEnv" (dict "root" . "metrics" ":9196") | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- include "collab-sphere.appResources" . | nindent 10 }}
