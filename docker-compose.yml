services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 2s
      timeout: 3s
      retries: 30
