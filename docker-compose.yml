services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  permission-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: permission
      POSTGRES_PASSWORD: permission
      POSTGRES_DB: permission
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permission -d permission"]
      interval: 2s
      timeout: 3s
      retries: 30
  permission-service:
    build:
      context: .
      args:
        SERVICE: permission-service
    environment:
      DATABASE_URL: postgres://permission:permission@permission-db:5432/permission?sslmode=disable
      GRPC_ADDR: ":9094"
      AUTH_PUBLIC_KEY: wBiwn96X59Q0XaGgZIFY1UDnR55L2agldgCbneQFQvM=
      SHARE_PRIVATE_KEY: 1/Phydme/tVCmEdnYd3iDBlvCBEtVvanqFUW10vwMg0=
      INTERNAL_TOKEN: 99555b306395f2318808fdf9d3c6e1262e809d072790eeb91871cdc6c7214ee8
      DOCUMENT_ADDR: document-service:9090
      METRICS_ADDR: ":9194"
    ports:
      - "9094:9094"
      - "9194:9194"
    depends_on:
      permission-db:
        condition: service_healthy
  export-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: export
      POSTGRES_PASSWORD: export
      POSTGRES_DB: export
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U export -d export"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: collab
      MINIO_ROOT_PASSWORD: collabsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "/usr/bin/minio", "--version"]
      interval: 2s
      timeout: 5s
      retries: 30
  export-service:
    build:
      context: .
      args:
        SERVICE: export-service
    environment:
      DATABASE_URL: postgres://export:export@export-db:5432/export?sslmode=disable
      GRPC_ADDR: ":9095"
      AUTH_PUBLIC_KEY: wBiwn96X59Q0XaGgZIFY1UDnR55L2agldgCbneQFQvM=
      INTERNAL_TOKEN: 99555b306395f2318808fdf9d3c6e1262e809d072790eeb91871cdc6c7214ee8
      DOCUMENT_ADDR: document-service:9090
      VERSION_ADDR: version-service:9093
      PERMISSION_ADDR: permission-service:9094
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: exports
      S3_ACCESS_KEY: collab
      S3_SECRET_KEY: collabsecret
      S3_REGION: us-east-1
      METRICS_ADDR: ":9195"
    ports:
      - "9095:9095"
      - "9195:9195"
    depends_on:
      export-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      permission-service:
        condition: service_started
  comment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: comment
      POSTGRES_PASSWORD: comment
      POSTGRES_DB: comment
    ports:
      - "55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comment -d comment"]
      interval: 2s
      timeout: 3s
      retries: 30
  version-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: version
      POSTGRES_PASSWORD: version
      POSTGRES_DB: version
    ports:
      - "55436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U version -d version"]
      interval: 2s
      timeout: 3s
      retries: 30
  document-service:
    build:
      context: .
      args:
        SERVICE: document-service
    environment:
      DATABASE_URL: postgres://collab:collab@postgres:5432/collab?sslmode=disable
      GRPC_ADDR: ":9090"
      AUTH_PUBLIC_KEY: wBiwn96X59Q0XaGgZIFY1UDnR55L2agldgCbneQFQvM=
      INTERNAL_TOKEN: 99555b306395f2318808fdf9d3c6e1262e809d072790eeb91871cdc6c7214ee8
      PERMISSION_ADDR: permission-service:9094
      METRICS_ADDR: ":9190"
    ports:
      - "9090:9090"
      - "9190:9190"
    depends_on:
      postgres:
        condition: service_healthy
  presence-service:
    build:
      context: .
      args:
        SERVICE: presence-service
    environment:
      REDIS_URL: redis://redis:6379/0
      GRPC_ADDR: ":9091"
      INTERNAL_TOKEN: 99555b306395f2318808fdf9d3c6e1262e809d072790eeb91871cdc6c7214ee8
      PRESENCE_TTL: 30s
      PRESENCE_SWEEP: 1s
      METRICS_ADDR: ":9191"
    ports:
      - "9091:9091"
      - "9191:9191"
    depends_on:
      redis:
        condition: service_healthy
  comment-service:
    build:
      context: .
      args:
        SERVICE: comment-service
    environment:
      DATABASE_URL: postgres://comment:comment@comment-db:5432/comment?sslmode=disable
      GRPC_ADDR: ":9092"
      DOCUMENT_ADDR: document-service:9090
      VERSION_ADDR: version-service:9093
      AUTH_PUBLIC_KEY: wBiwn96X59Q0XaGgZIFY1UDnR55L2agldgCbneQFQvM=
      INTERNAL_TOKEN: 99555b306395f2318808fdf9d3c6e1262e809d072790eeb91871cdc6c7214ee8
      PERMISSION_ADDR: permission-service:9094
      METRICS_ADDR: ":9192"
    ports:
      - "9092:9092"
      - "9192:9192"
    depends_on:
      comment-db:
        condition: service_healthy
  version-service:
    build:
      context: .
      args:
        SERVICE: version-service
    environment:
      DATABASE_URL: postgres://version:version@version-db:5432/version?sslmode=disable
      GRPC_ADDR: ":9093"
      DOCUMENT_ADDR: document-service:9090
      AUTH_PUBLIC_KEY: wBiwn96X59Q0XaGgZIFY1UDnR55L2agldgCbneQFQvM=
      INTERNAL_TOKEN: 99555b306395f2318808fdf9d3c6e1262e809d072790eeb91871cdc6c7214ee8
      PERMISSION_ADDR: permission-service:9094
      METRICS_ADDR: ":9193"
    ports:
      - "9093:9093"
      - "9193:9193"
    depends_on:
      version-db:
        condition: service_healthy
  collab-hub:
    build:
      context: .
      args:
        SERVICE: collab-hub
    environment:
      HTTP_ADDR: ":8080"
      DOCUMENT_SERVICE_ADDR: document-service:9090
      AUTH_PUBLIC_KEY: wBiwn96X59Q0XaGgZIFY1UDnR55L2agldgCbneQFQvM=
      INTERNAL_TOKEN: 99555b306395f2318808fdf9d3c6e1262e809d072790eeb91871cdc6c7214ee8
      PERMISSION_ADDR: permission-service:9094
      REDIS_URL: redis://redis:6379/0
      PRESENCE_SERVICE_ADDR: presence-service:9091
      PRESENCE_HEARTBEAT: 10s
      METRICS_ADDR: ":9196"
    ports:
      - "8080:8080"
      - "9196:9196"
    depends_on:
      redis:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=:9090
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9098:9090"
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/collab.json:/var/lib/grafana/dashboards/collab.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
