syntax = "proto3";

package permission.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/rowjay007/collab-sphere/gen/permission/v1;permissionv1";

service PermissionService {
  rpc EnsureOwner(EnsureOwnerRequest) returns (GrantRecord);
  rpc Grant(GrantRequest) returns (GrantRecord);
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  rpc CreateLink(CreateLinkRequest) returns (ShareLink);
  rpc RevokeLink(RevokeLinkRequest) returns (RevokeLinkResponse);
  rpc Redeem(RedeemRequest) returns (GrantRecord);
  rpc PolicyDump(PolicyDumpRequest) returns (PolicyDumpResponse);
  rpc CopyGrants(CopyGrantsRequest) returns (CopyGrantsResponse);
  rpc PutKey(PutKeyRequest) returns (PublicKey);
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
  rpc PublishWraps(PublishWrapsRequest) returns (PublishWrapsResponse);
  rpc GetWraps(GetWrapsRequest) returns (GetWrapsResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_EDITOR = 2;
  ROLE_COMMENTER = 3;
  ROLE_VIEWER = 4;
}

message GrantRecord {
  string doc_id = 1;
  string user_id = 2;
  Role role = 3;
}

message EnsureOwnerRequest {
  string doc_id = 1;
  string user_id = 2;
  // encrypted starts epoch 1 pending in the same transaction as the owner grant.
  bool encrypted = 3;
}

message GrantRequest {
  string doc_id = 1;
  string user_id = 2;
  Role role = 3;
  // wraps is one wrap per epoch from 1 through the current epoch, for user_id,
  // when the document is encrypted. Empty on a plain document.
  repeated KeyWrap wraps = 4;
}

message RevokeRequest {
  string doc_id = 1;
  string user_id = 2;
}

message RevokeResponse {}

message CreateLinkRequest {
  string doc_id = 1;
  Role role = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message ShareLink {
  string id = 1;
  string doc_id = 2;
  Role role = 3;
  google.protobuf.Timestamp expires_at = 4;
  string token = 5;
}

message RevokeLinkRequest {
  string id = 1;
}

message RevokeLinkResponse {}

message RedeemRequest {
  string token = 1;
}

message PolicyDumpRequest {
  string doc_id = 1;
}

message PolicyDumpResponse {
  map<string, Role> members = 1;
  uint32 write_epoch = 2;
  string epoch_state = 3;
}

message CopyGrantsRequest {
  string source_doc_id = 1;
  string dest_doc_id = 2;
}

message CopyGrantsResponse {}

message PublicKey {
  string key_id = 1;
  string user_id = 2;
  bytes public_key = 3;
}

message PutKeyRequest {
  bytes public_key = 1;
}

message ListKeysRequest {
  string user_id = 1;
}

message ListKeysResponse {
  repeated PublicKey keys = 1;
}

// KeyWrap is a document key sealed to one member for one epoch.
message KeyWrap {
  uint32 epoch = 1;
  string user_id = 2;
  string key_id = 3;
  bytes eph_pub = 4;
  bytes nonce = 5;
  bytes ciphertext = 6;
}

message PublishWrapsRequest {
  string doc_id = 1;
  string request_id = 2;
  repeated KeyWrap wraps = 3;
}

message PublishWrapsResponse {
  uint32 write_epoch = 1;
  string epoch_state = 2;
}

message GetWrapsRequest {
  string doc_id = 1;
}

message GetWrapsResponse {
  repeated KeyWrap wraps = 1;
}
