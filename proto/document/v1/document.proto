syntax = "proto3";

package document.v1;

import "crdt/v1/snapshot.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rowjay007/collab-sphere/gen/document/v1;documentv1";

service DocumentService {
  rpc CreateDocument(CreateDocumentRequest) returns (Document);
  rpc GetDocument(GetDocumentRequest) returns (Document);
  rpc ArchiveDocument(ArchiveDocumentRequest) returns (Document);
  // LoadState returns the latest snapshot plus every operation appended
  // after it. Applying the operations to the snapshot yields the current state.
  rpc LoadState(LoadStateRequest) returns (LoadStateResponse);
  rpc AppendOperations(AppendOperationsRequest) returns (AppendOperationsResponse);
  rpc ReadOperations(ReadOperationsRequest) returns (ReadOperationsResponse);
  rpc ClaimReplica(ClaimReplicaRequest) returns (ClaimReplicaResponse);
  rpc ForkDocument(ForkDocumentRequest) returns (Document);
  rpc ListChangedDocuments(ListChangedRequest) returns (ListChangedResponse);
  // SetEpoch moves the open write epoch. The same pair is a no-op. An older
  // epoch is rejected. Internal callers only.
  rpc SetEpoch(SetEpochRequest) returns (Document);
  // ReportVector stores one replica's version vector on the document's fork
  // tree. A vector below the stored report on any client is rejected and the
  // old row stands. Internal callers only.
  rpc ReportVector(ReportVectorRequest) returns (ReportVectorResponse);
  // ListReports returns every report for the fork tree, including released replicas.
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse);
  // ReleaseReplica sets released_at. The row stays. Internal callers only.
  rpc ReleaseReplica(ReleaseReplicaRequest) returns (ReleaseReplicaResponse);
}

message Document {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACTIVE = 1;
    STATUS_ARCHIVED = 2;
  }
  string id = 1;
  string title = 2;
  string owner_id = 3;
  Status status = 4;
  uint64 op_seq = 5;
  uint64 snapshot_seq = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string fork_of = 9;
  uint64 fork_seq = 10;
  string fork_root = 11;
  // encryption is "plain" or "encrypted" and never changes.
  string encryption = 12;
  uint32 write_epoch = 13;
  // epoch_state is "", "pending", or "open". Empty means a plain document.
  string epoch_state = 14;
}

message CreateDocumentRequest {
  string title = 1;
  string owner_id = 2;
  bool encrypted = 3;
}

message SetEpochRequest {
  string id = 1;
  uint32 write_epoch = 2;
  string epoch_state = 3;
}

message GetDocumentRequest {
  string id = 1;
}

message ArchiveDocumentRequest {
  string id = 1;
}

message LoadStateRequest {
  string id = 1;
}

message LoadStateResponse {
  Document document = 1;
  crdt.v1.Snapshot snapshot = 2;
  repeated crdt.v1.Operation operations = 3;
}

message AppendOperationsRequest {
  string id = 1;
  repeated crdt.v1.Operation operations = 2;
}

message AppendOperationsResponse {
  uint64 op_seq = 1;
  // Parallel to the request's operations. A newly stored op gets its new seq. An op already stored
  // gets its existing seq. A repeat inside the same request gets the seq of its first occurrence.
  repeated uint64 seqs = 2;
  // Lowest seq this call assigned, or 0 when every op was already stored. Newly stored ops hold
  // exactly first_new_seq..op_seq. Existing seqs are always below first_new_seq.
  uint64 first_new_seq = 3;
}

message ReadOperationsRequest {
  string id = 1;
  uint64 after_seq = 2;
  uint32 limit = 3;
}

message ReadOperationsResponse {
  // Seq of operations[0]; operations are contiguous seqs first_seq..first_seq+len-1.
  // Zero when operations is empty.
  uint64 first_seq = 1;
  repeated crdt.v1.Operation operations = 2;
  uint64 op_seq = 3;
  // live_seq and collected come from the live snapshot row when present.
  uint64 live_seq = 4;
  repeated crdt.v1.VectorEntry collected = 5;
}

message ClaimReplicaRequest {
  string document_id = 1;
  uint64 client = 2;
  bool system = 3;
  string user_id = 4;
}

message ClaimReplicaResponse {
  uint64 client = 1;
}

message ForkDocumentRequest {
  string source_id = 1;
  uint64 seq = 2;
  string title = 3;
  string request_id = 4;
}

message ListChangedRequest {
  google.protobuf.Timestamp since = 1;
  uint32 limit = 2;
  string after_id = 3;
}

message ListChangedResponse {
  repeated Document documents = 1;
  google.protobuf.Timestamp next_since = 2;
  string next_after_id = 3;
}

message ReportVectorRequest {
  string document_id = 1;
  uint64 replica_id = 2;
  repeated crdt.v1.VectorEntry vector = 3;
  uint64 home_seq = 4;
}

message ReportVectorResponse {}

message ListReportsRequest {
  string fork_root = 1;
}

message ReplicaReport {
  uint64 replica_id = 1;
  repeated crdt.v1.VectorEntry vector = 2;
  uint64 home_seq = 3;
  google.protobuf.Timestamp reported_at = 4;
  google.protobuf.Timestamp released_at = 5;
}

message ListReportsResponse {
  repeated ReplicaReport reports = 1;
}

message ReleaseReplicaRequest {
  string document_id = 1;
  uint64 replica_id = 2;
}

message ReleaseReplicaResponse {}
