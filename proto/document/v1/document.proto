syntax = "proto3";

package document.v1;

import "crdt/v1/snapshot.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rowjay007/collab-sphere/gen/document/v1;documentv1";

service DocumentService {
  rpc CreateDocument(CreateDocumentRequest) returns (Document);
  rpc GetDocument(GetDocumentRequest) returns (Document);
  rpc ArchiveDocument(ArchiveDocumentRequest) returns (Document);
  // LoadState returns the latest snapshot plus every operation appended
  // after it. Applying the operations to the snapshot yields the current state.
  rpc LoadState(LoadStateRequest) returns (LoadStateResponse);
  rpc AppendOperations(AppendOperationsRequest) returns (AppendOperationsResponse);
  rpc ReadOperations(ReadOperationsRequest) returns (ReadOperationsResponse);
}

message Document {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ACTIVE = 1;
    STATUS_ARCHIVED = 2;
  }
  string id = 1;
  string title = 2;
  string owner_id = 3;
  Status status = 4;
  uint64 op_seq = 5;
  uint64 snapshot_seq = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateDocumentRequest {
  string title = 1;
  string owner_id = 2;
}

message GetDocumentRequest {
  string id = 1;
}

message ArchiveDocumentRequest {
  string id = 1;
}

message LoadStateRequest {
  string id = 1;
}

message LoadStateResponse {
  Document document = 1;
  crdt.v1.Snapshot snapshot = 2;
  repeated crdt.v1.Operation operations = 3;
}

message AppendOperationsRequest {
  string id = 1;
  repeated crdt.v1.Operation operations = 2;
}

message AppendOperationsResponse {
  uint64 op_seq = 1;
  // Parallel to the request's operations. A newly stored op gets its new seq. An op already stored
  // gets its existing seq. A repeat inside the same request gets the seq of its first occurrence.
  repeated uint64 seqs = 2;
  // Lowest seq this call assigned, or 0 when every op was already stored. Newly stored ops hold
  // exactly first_new_seq..op_seq. Existing seqs are always below first_new_seq.
  uint64 first_new_seq = 3;
}

message ReadOperationsRequest {
  string id = 1;
  uint64 after_seq = 2;
  uint32 limit = 3;
}

message ReadOperationsResponse {
  // Seq of operations[0]; operations are contiguous seqs first_seq..first_seq+len-1.
  // Zero when operations is empty.
  uint64 first_seq = 1;
  repeated crdt.v1.Operation operations = 2;
  uint64 op_seq = 3;
}
