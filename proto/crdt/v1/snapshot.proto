syntax = "proto3";

package crdt.v1;

option go_package = "github.com/rowjay007/collab-sphere/gen/crdt/v1;crdtv1";

// OpID is a Lamport timestamp. The zero value is the document root and is
// never assigned to an operation.
message OpID {
  uint64 client = 1;
  uint64 clock = 2;
}

message Insert {
  OpID parent = 1;
  uint32 value = 2;
}

message Delete {
  OpID target = 1;
}

message Operation {
  OpID id = 1;
  oneof kind {
    Insert insert = 2;
    Delete delete = 3;
  }
}

message VectorEntry {
  uint64 client = 1;
  uint64 clock = 2;
}

// Node is one RGA element. deleted_by holds the IDs of every delete that
// targeted it, ascending; it is empty for live characters.
message Node {
  OpID id = 1;
  OpID parent = 2;
  uint32 value = 3;
  repeated OpID deleted_by = 4;
}

// Snapshot is the full replica state. nodes are in document order, so every
// parent precedes its children. pending holds operations whose dependency has
// not arrived, ascending by ID. vector and collected are ascending by client.
message Snapshot {
  repeated Node nodes = 1;
  repeated Operation pending = 2;
  repeated VectorEntry vector = 3;
  repeated VectorEntry collected = 4;
}
