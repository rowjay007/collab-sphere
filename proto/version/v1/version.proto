syntax = "proto3";

package version.v1;

import "crdt/v1/snapshot.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rowjay007/collab-sphere/gen/version/v1;versionv1";

// Every RPC that names a document first materializes it to its current op_seq.
service VersionService {
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc GetVersion(GetVersionRequest) returns (Version);
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);
  // Checkpoint names the node at the document's current op_seq. The name is an
  // immutable ref: the same name on the same node is a no-op, on another node
  // AlreadyExists.
  rpc Checkpoint(CheckpointRequest) returns (Version);
  // Branch forks the version's document at the version's seq.
  rpc Branch(BranchRequest) returns (BranchResponse);
  rpc Diff(DiffRequest) returns (DiffResponse);
  // Frontier returns the document at its head seq plus every document its
  // nodes reach through cross-document parents, each at the highest seq reached.
  rpc Frontier(FrontierRequest) returns (FrontierResponse);
  // Merge appends the source ops that the target lacks. Same request_id
  // returns the recorded result. A rerun that is already contained is noop.
  rpc Merge(MergeRequest) returns (MergeResponse);
  // Restore appends ops that make the document's visible text equal the
  // version's. The returned node is new and names restored_from.
  rpc Restore(RestoreRequest) returns (Version);
}

message Version {
  bytes id = 1;
  string doc_id = 2;
  uint64 seq = 3;
  bytes content_hash = 4;
  repeated bytes parents = 5;
  // "genesis", "auto", "fork", "fork-base", "checkpoint:<name>".
  repeated string labels = 6;
  bytes restored_from = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListVersionsRequest {
  string doc_id = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListVersionsResponse {
  // Ascending by seq.
  repeated Version versions = 1;
  string next_page_token = 2;
}

message GetVersionRequest {
  bytes id = 1;
}

message GetBlobRequest {
  bytes hash = 1;
}

message GetBlobResponse {
  // The canonical snapshot bytes of ADR 0010; their SHA-256 is the hash.
  bytes bytes = 1;
}

message CheckpointRequest {
  string doc_id = 1;
  string name = 2;
  string request_id = 3;
}

message BranchRequest {
  bytes version_id = 1;
  string title = 2;
  string request_id = 3;
}

message BranchResponse {
  string document_id = 1;
  // The fork's first node; its only parent is the version branched from.
  Version version = 2;
}

message DiffRequest {
  bytes from_version_id = 1;
  bytes to_version_id = 2;
}

message Span {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_RETAINED = 1;
    KIND_INSERTED = 2;
    KIND_DELETED = 3;
  }
  Kind kind = 1;
  string text = 2;
  crdt.v1.OpID first = 3;
  crdt.v1.OpID last = 4;
}

message DiffResponse {
  repeated Span spans = 1;
}

message FrontierRequest {
  string doc_id = 1;
}

message FrontierEntry {
  string document_id = 1;
  uint64 seq = 2;
}

message FrontierResponse {
  repeated FrontierEntry entries = 1;
}

message MergeRequest {
  string source_doc_id = 1;
  string target_doc_id = 2;
  string request_id = 3;
}

message MergeResponse {
  Version version = 1;
  uint32 appended = 2;
  bool noop = 3;
}

message RestoreRequest {
  string doc_id = 1;
  bytes version_id = 2;
  string request_id = 3;
}

// Persisted mutation plan: the exact ops that will be Appended.
message OpPlan {
  repeated crdt.v1.Operation operations = 1;
}
